name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "stg", "dev" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REGISTRY: ${{ env.REGISTRY }}
          ENV: ${{ vars.ENV }}
          PORT: ${{ vars.PORT }}
          CONTAINER: ${{ vars.CONTAINER }}
        #  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        #  FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
        #  FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

          DEBUG: ${{ vars.DEBUG }}
          SERVICE_PORT: ${{ vars.SERVICE_PORT }}
          
          # Billing & Payment - Authentication Keys
          INTERNAL_JWT_SECRET: ${{ secrets.INTERNAL_JWT_SECRET }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          INTERNAL_SERVICE_KEY: ${{ secrets.INTERNAL_SERVICE_KEY }}

          DATABASES_NAME: ${{ secrets.DATABASES_NAME }}
          DATABASES_USER: ${{ secrets.DATABASES_USER }}
          DATABASES_PASSWORD: ${{ secrets.DATABASES_PASSWORD }}
          DATABASES_HOST: ${{ secrets.DATABASES_HOST }}
          DATABASES_PORT: ${{ secrets.DATABASES_PORT }}
          USE_POSTGRESQL: ${{ vars.USE_POSTGRESQL }}

        run: |
          # Deploy commands
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << EOF
            echo "🔑 Logging to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "📦 Pulling image..."
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            
            echo "🛑 Stopping old container..."
            docker stop $CONTAINER 2>/dev/null || true
            docker rm $CONTAINER 2>/dev/null || true
            
            echo "🚀 Starting new container on port $PORT..."
            docker run -d \
              --name $CONTAINER \
              --restart unless-stopped \
              -p $PORT:$SERVICE_PORT \
              -e ENV=$ENV \
              -e DEBUG=$DEBUG \
              -e SERVICE_PORT=$SERVICE_PORT \
              -e INTERNAL_JWT_SECRET=$INTERNAL_JWT_SECRET \
              -e PAYOS_CHECKSUM_KEY=$PAYOS_CHECKSUM_KEY \
              -e INTERNAL_SERVICE_KEY=$INTERNAL_SERVICE_KEY \
              -e DATABASES_NAME=$DATABASES_NAME \
              -e DATABASES_USER=$DATABASES_USER \
              -e DATABASES_PASSWORD=$DATABASES_PASSWORD \
              -e DATABASES_HOST=$DATABASES_HOST \
              -e DATABASES_PORT=$DATABASES_PORT \
              -e USE_POSTGRESQL=$USE_POSTGRESQL \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            
            echo "✅ Deployment complete!"
            echo "📋 Container status:"
            docker ps | grep $CONTAINER

            # Dọn dẹp images cũ
            echo "🧹 Cleaning up old images..."
            docker image prune -f
          EOF
